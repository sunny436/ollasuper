name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the workflow token (audit D-06).
permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test

  # Python inference plane: hermetic unit tests PLUS the pgvector-backed DB tests
  # (gated on TEST_DATABASE_URL, so `uv run pytest` locally stays no-network).
  # The pgvector/pgvector:pg16 service matches production + ships pgvector >=0.8.
  ai-tests:
    runs-on: ubuntu-latest
    services:
      knowledge-db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: myos_ai
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myos_knowledge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myos_ai -d myos_knowledge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KNOWLEDGE_DATABASE_URL: postgresql://myos_ai:postgres@127.0.0.1:5432/myos_knowledge_test?sslmode=disable
      TEST_DATABASE_URL: postgresql://myos_ai:postgres@127.0.0.1:5432/myos_knowledge_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Pinned action + pinned uv, not `curl | sh` of whatever is current.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.19"
      - name: Sync (frozen)
        working-directory: services/ai
        run: uv sync --frozen
      - name: Migrate (covers the migration for real)
        working-directory: services/ai
        run: uv run alembic upgrade head
      - name: Ruff
        working-directory: services/ai
        run: uv run ruff check .
      # Ubuntu 24.04 runners forbid unprivileged user namespaces (AppArmor), so
      # the sandbox child (`unshare -rnm`) exits rc=1 and every sandboxed op
      # fails closed. Production runs it as root; this lets CI exercise the same
      # tier-1 sandbox instead of failing before it starts.
      - name: Allow the sandbox's user namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Pytest (unit + db)
        working-directory: services/ai
        run: uv run pytest

  # New secrets in THIS change (audit D-01/D-06). Scans the commits the push or
  # PR adds — not all history: the one historical leak is a provider-side
  # rotation matter (see SECURITY-AUDIT-FINAL.md D-01), and gating every build
  # on a commit nobody can change would only teach people to ignore this job.
  # Same pinned, checksum-verified Gitleaks as deploy/65-secaudit.sh.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Gitleaks over the commits in this change
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_TGZ_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          curl -fsSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_TGZ_SHA256}  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${BASE_SHA}..HEAD"
          else
            RANGE="-1"
          fi
          ./gitleaks git --redact --no-banner --log-opts="$RANGE" .
