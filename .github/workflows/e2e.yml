name: E2E

on:
  workflow_dispatch:
  pull_request:

# Least privilege for the workflow token (audit D-06).
permissions:
  contents: read

env:
  CONVEX_ENV: |
    DISABLE_BEACON=true
    PORT=3210
    SITE_PROXY_PORT=3211
    DASHBOARD_PORT=6791
    CONVEX_CLOUD_ORIGIN=http://127.0.0.1:3210
    CONVEX_SITE_ORIGIN=http://127.0.0.1:3211
  # Ephemeral-CI admin password. Compliant with the sign-up policy (upper/lower/
  # digit/special, not common, and — unlike the retired repo-literal password — does NOT
  # contain the admin@myos.test local-part "admin" or domain label "myos").
  ADMIN_PASSWORD: "Sentry9#Vault"

jobs:
  contract:
    name: Adversarial IDOR (live backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - name: Start self-hosted Convex backend
        run: |
          cd self-hosted
          printf '%s\n' "$CONVEX_ENV" > .env
          docker compose up -d backend
      - name: Wait for backend health
        run: for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3210/version && echo " ok" && break; sleep 2; done
      - name: Deploy functions
        run: |
          KEY=$(cd self-hosted && docker compose exec -T backend ./generate_admin_key.sh | tr -d '\r' | grep -F '|' | tail -1 | tr -d '[:space:]')
          node scripts/generateKeys.mjs
          cd packages/backend
          export CONVEX_SELF_HOSTED_URL='http://127.0.0.1:3210' CONVEX_SELF_HOSTED_ADMIN_KEY="$KEY"
          CVX="node ../../node_modules/convex/bin/main.js"
          $CVX env set -- JWKS "$(cat /tmp/jwks)"
          $CVX env set -- JWT_PRIVATE_KEY "$(cat /tmp/jwt_private_key)"
          $CVX env set SITE_URL http://localhost:3000
          $CVX env set AUTH_EXTRA_ALLOWED_DOMAINS myos.test
          $CVX deploy -y
      - name: Adversarial IDOR / RBAC suite
        run: CONVEX_URL=http://127.0.0.1:3210 node e2e/p2-idor.js
      - name: Backend logs (on failure)
        if: failure()
        run: cd self-hosted && docker compose logs --tail=120 backend

  browser:
    name: Browser E2E (live stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - name: Start self-hosted Convex backend
        run: |
          cd self-hosted
          printf '%s\n' "$CONVEX_ENV" > .env
          docker compose up -d backend
      - name: Wait for backend health
        run: for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3210/version && echo " ok" && break; sleep 2; done
      - name: Deploy functions
        run: |
          KEY=$(cd self-hosted && docker compose exec -T backend ./generate_admin_key.sh | tr -d '\r' | grep -F '|' | tail -1 | tr -d '[:space:]')
          node scripts/generateKeys.mjs
          cd packages/backend
          export CONVEX_SELF_HOSTED_URL='http://127.0.0.1:3210' CONVEX_SELF_HOSTED_ADMIN_KEY="$KEY"
          CVX="node ../../node_modules/convex/bin/main.js"
          $CVX env set -- JWKS "$(cat /tmp/jwks)"
          $CVX env set -- JWT_PRIVATE_KEY "$(cat /tmp/jwt_private_key)"
          $CVX env set SITE_URL http://localhost:3000
          $CVX env set AUTH_EXTRA_ALLOWED_DOMAINS myos.test
          $CVX deploy -y
      - name: Bootstrap admin account
        run: CONVEX_URL=http://127.0.0.1:3210 node e2e/ci-bootstrap.js
      - name: Build app
        env:
          NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
          CONVEX_URL: http://127.0.0.1:3210
        run: cd apps/app && bun run build
      - name: Start app
        env:
          NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
          CONVEX_URL: http://127.0.0.1:3210
          PORT: "3000"
        run: |
          cd apps/app
          bun run start > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/en/login >/dev/null && echo "app up" && break; sleep 2; done
      - name: Install Playwright
        run: cd e2e && bun install && bunx playwright install --with-deps chromium
      - name: Run browser suites
        env:
          E2E_BASE_URL: http://localhost:3000
        run: |
          cd e2e
          # p-chat is deliberately NOT here: its header says it "requires a live
          # deployed stack with the AI service configured", and this job runs no
          # services/ai, so its streaming/stop steps can never pass. It stays a
          # VM suite. p-sidebar is the CI guard for /chat instead — it now loads
          # the route (which is the landing page, since / redirects there) and
          # exits non-zero on any console error.
          for s in p-sidebar p-notif p-cmdk; do
            echo "::group::$s"; node "$s.js" || { echo "::endgroup::"; exit 1; }; echo "::endgroup::"
          done
      - name: App + backend logs (on failure)
        if: failure()
        run: |
          echo "=== app log ==="; tail -60 /tmp/app.log || true
          echo "=== backend log ==="; cd self-hosted && docker compose logs --tail=120 backend
