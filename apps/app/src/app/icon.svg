  <!--
    The favicon CANNOT use currentColor. A favicon renders outside any document,
    so currentColor resolves to this SVG own color - which defaults to black - and
    the mark would vanish in dark browser chrome. It therefore carries its own
    media query, which is the one legitimate reason this file is not simply the
    React component serialised.

    The geometry is identical to OLLA_MARK_PATH in
    src/components/branding/olla-super-logo.tsx, and branding.test.ts fails if the
    two ever drift.
  -->
  <style>
    path { fill: #000000; stroke: #000000 }
    @media (prefers-color-scheme: dark) { path { fill: #FFFFFF; stroke: #FFFFFF } }
  </style>
