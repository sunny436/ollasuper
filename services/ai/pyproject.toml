[project]
name = "myos-ai"
version = "0.1.0"
description = "myos AI inference plane — FastAPI + LangGraph, streaming into Convex"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "pydantic==2.13.4",
    "pydantic-settings>=2.7,<3",
    "httpx==0.28.1",
    "langchain-core==1.5.4",
    "langchain==1.3.15",
    "langchain-openai==1.5.0",
    "langgraph==1.2.11",
    # NOT python-jose: it has algorithm-confusion CVEs (2024-33663/33664), a thin
    # maintenance cadence, and no JWKS client at all — you would hand-roll fetch
    # and cache, which is exactly where JWKS bugs live. PyJWKClient is the direct
    # analogue of the jose createRemoteJWKSet used in backend-echo/server.mjs.
    "pyjwt[crypto]>=2.10,<3",
    "pillow>=11,<12",
    "pypdf>=5,<6",
    # --- File Knowledge System (RAG) ---
    # Dedicated pgvector DB accessed only from this service. psycopg3 (not
    # asyncpg): it takes the libpq URL — including ?sslmode=disable — as-is, so
    # SQLAlchemy needs no query-param translation.
    "sqlalchemy[asyncio]>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<1",
    "alembic>=1.13,<2",
    # Document parsing + chunking. langchain-text-splitters tracks the pinned
    # langchain line; the rest are mature, single-purpose parsers — one
    # best-in-class extractor per format, ALL permissively licensed and shipping
    # self-contained wheels (no poppler/tesseract/libreoffice system binaries).
    "langchain-text-splitters>=1,<2",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "python-pptx>=1,<2",
    # PDF: pdfplumber (MIT, best pure-python text+tables) for digital PDFs;
    # pypdfium2 (BSD/Apache, PDFium wheels) renders image-only pages so the
    # vision-OCR fallback can read scanned PDFs. Deliberately NOT PyMuPDF: it is
    # faster but AGPL-3.0 (commercial-license or copyleft) — see ingest/pdf.py.
    "pdfplumber>=0.11,<1",
    "pypdfium2>=4,<5",
    # HTML: trafilatura (Apache-2.0 since >=1.8) is the benchmark leader for
    # main-content extraction — far better than bs4 get_text() on real pages.
    "trafilatura>=2,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<6",
    "filetype>=1.2,<2",
    # defusedxml hardens the XML parsing that openpyxl/python-docx do under the
    # hood (XXE / billion-laughs) for untrusted uploads.
    "defusedxml>=0.7,<1",
    "rapidocr-onnxruntime>=1.4.4",
]

# Deliberately NOT langchain-anthropic: it speaks the native Anthropic Messages
# API and cannot reach OpenRouter. All traffic goes through langchain-openai's
# ChatOpenAI pointed at OpenRouter's OpenAI-compatible endpoint.

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# DB-backed tests are gated: they self-skip unless TEST_DATABASE_URL points at a
# Postgres+pgvector (>=0.8). The default `uv run pytest` stays hermetic/no-network.
markers = [
    "db: requires a live Postgres+pgvector via TEST_DATABASE_URL",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # hardcoded test secrets are intentional
# The only f-string in these queries interpolates `embedding_dimensions`, a
# trusted int from config that is the SQL vector TYPE size (vector(N)/halfvec(N))
# — a type parameter, which cannot be a bind. Every value is a bind parameter.
"app/db/store.py" = ["S608"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
